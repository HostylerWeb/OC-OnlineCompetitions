name: onlinecompetitions-dev

services:
  mongodb:
    image: mongo:7
    container_name: oc_dev_mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27018:27017"
    volumes:
      - oc_dev_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo-init:
    image: mongo:7
    container_name: oc_dev_mongo_init
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./scripts/mongo-init.js:/init.js:ro
    entrypoint: >
      /bin/sh -c "
      sleep 2;
      mongosh 'mongodb://mongodb:27017/admin' --quiet /init.js || true;
      exit 0;
      "

  mailpit:
    image: axllent/mailpit:latest
    container_name: oc_dev_mailpit
    restart: unless-stopped
    ports:
      - "1026:1025"
      - "1081:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    volumes:
      - oc_dev_mailpit_data:/data

  minio:
    image: minio/minio:latest
    container_name: oc_dev_minio
    restart: unless-stopped
    command: server /data/minio --console-address ":9001"
    environment:
      MINIO_ROOT_USER: oc_dev_access_key
      MINIO_ROOT_PASSWORD: oc_dev_secret_key
    ports:
      - "9021:9000"
    volumes:
      - oc_dev_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  createbuckets:
    image: minio/mc:latest
    container_name: oc_dev_minio_init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 oc_dev_access_key oc_dev_secret_key;
      mc mb local/onlinecompetitions-assets --ignore-existing;
      mc anonymous set public local/onlinecompetitions-assets;
      exit 0;
      "

  redis:
    image: redis:7-alpine
    container_name: oc_dev_redis
    restart: unless-stopped
    profiles:
      - bundled-redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save ""
      --tcp-keepalive 60
      --timeout 300
    ports:
      - "6382:6379"
    volumes:
      - oc_dev_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  oc_dev_mongo_data:
  oc_dev_mailpit_data:
  oc_dev_minio_data:
  oc_dev_redis_data:
